<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI CHATBOT TESTER</title>
    <style>
        #chatForm{
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
    </style>
</head>
<body>
    <form id="chatForm">
        <select name="provider">
            <option>Google</option>
            <option>Groq</option>
        </select>
        <select name="model">
            <option>gemma-4-26b-a4b-it</option>
            <option>openai/gpt-oss-120b</option>
        </select>
      <input name="ask" />
      <button>물어보기</button>
    </form>
    <section id="chatContainer">
        
    </section>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
      const chatForm = document.querySelector("#chatForm");
      const chatContainer = document.querySelector("#chatContainer")
      chatForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const formData = new FormData(event.target);
        console.log("formData", ...formData);
        const response = await axios.post("/chat", Object.fromEntries(formData));
        
        const {result} = response.data;
        const p = document.createElement("p")
        p.textContent = `
        Ask : ${formData.get("ask")}<br>
        Asw : ${result}`;
        chatContainer.append(p);
      });
    </script>
</body>
</html>
